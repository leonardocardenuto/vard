appId: com.vard.app
name: Navegacao - inicio, espacos, analises, ajustes e logout
---
- runFlow: ../shared/login.yaml
- assertVisible: "Nenhum incidente detectado hoje"
- assertNotVisible: "Abrir alertas"
- tapOn:
    id: tab-Workspace
- assertVisible: "Escolha o espaço de família"
- assertVisible: "Casa Maestro"
- tapOn:
    id: tab-Insights
- assertVisible: "Quedas x dias"
- tapOn:
    id: tab-Settings
- assertVisible: "Ajustes do Sistema"
- assertNotVisible: "Prévia local"
- scrollUntilVisible:
    element:
      text: "Sair da conta"
    direction: DOWN
- tapOn: "Sair da conta"
- assertVisible: "ACESSAR SUA CONTA"
- assertNotVisible:
    id: tab-Settings
