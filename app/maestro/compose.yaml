services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vard_maestro
      POSTGRES_USER: vard_maestro
      POSTGRES_PASSWORD: local-maestro-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vard_maestro -d vard_maestro"]
      interval: 2s
      timeout: 3s
      retries: 30
