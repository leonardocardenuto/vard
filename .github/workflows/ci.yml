name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vard
          POSTGRES_USER: vard
          POSTGRES_PASSWORD: vard
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -U vard -d vard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_NAME: Vard API
      APP_ENV: test
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_DEBUG: "false"
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://vard:vard@localhost:5433/vard
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run database migrations
        run: python -m scripts.migrate

      - name: Validate FastAPI app
        run: python -c "from api.main import app; assert app.title == 'Vard API'"

  app:
    name: App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs:
      - api
      - app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          VARD_SERVER_HOST: ${{ secrets.VARD_SERVER_HOST }}
          VARD_SERVER_PORT: ${{ secrets.VARD_SERVER_PORT || '22' }}
          VARD_SERVER_USER: ${{ secrets.VARD_SERVER_USER }}
          VARD_SERVER_SSH_KEY: ${{ secrets.VARD_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VARD_SERVER_SSH_KEY" > ~/.ssh/vard_deploy_key
          chmod 600 ~/.ssh/vard_deploy_key
          ssh-keyscan -p "$VARD_SERVER_PORT" "$VARD_SERVER_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vard-server
            HostName $VARD_SERVER_HOST
            Port $VARD_SERVER_PORT
            User $VARD_SERVER_USER
            IdentityFile ~/.ssh/vard_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Deploy on server
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VARD_SERVER_PATH: ${{ secrets.VARD_SERVER_PATH || '/home/leo/vard' }}
          VARD_SYSTEMD_SERVICE: ${{ secrets.VARD_SYSTEMD_SERVICE || 'vard-api' }}
        run: |
          ssh vard-server "DEPLOY_SHA='$DEPLOY_SHA' VARD_SERVER_PATH='$VARD_SERVER_PATH' VARD_SYSTEMD_SERVICE='$VARD_SYSTEMD_SERVICE' bash -s" <<'EOF'
          set -euo pipefail

          cd "$VARD_SERVER_PATH"

          git fetch origin main
          git checkout main
          git reset --hard "$DEPLOY_SHA"

          docker compose up -d postgres redis

          .venv/bin/python -m pip install -r requirements-api.txt
          .venv/bin/python -m scripts.migrate

          sudo systemctl restart "$VARD_SYSTEMD_SERVICE"
          sleep 3
          systemctl is-active --quiet "$VARD_SYSTEMD_SERVICE"
          curl -fsS http://127.0.0.1:8000/health
          EOF
